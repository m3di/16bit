<!doctype html>
<html lang="en" class="theme-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>16bit.info</title>
    <!-- Sets the theme before first paint, so a dark theme does not flash light. Mirrors src/theme/theme.ts. -->
    <script id="theme-boot">
      ;(function () {
        var t
        try {
          t = localStorage.getItem('16bit.theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.className = 'theme-' + t
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
