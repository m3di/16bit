# TEMPORARY (issue 307): repeats the large-folder scroll budget with long-frame detail, a
# Chromium trace and the runner's CPU use. Never merged.
name: Diag 307

on:
  push:
    branches: ['frontend/307-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: Scroll budget diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      db:
        image: postgres:18.7-alpine3.24
        env:
          POSTGRES_USER: sixteenbit
          POSTGRES_PASSWORD: sixteenbit
          POSTGRES_DB: sixteenbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sixteenbit -d sixteenbit"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://sixteenbit_api:sixteenbit_api@127.0.0.1:5432/sixteenbit
      DIAG_307: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @16bit/e2e exec playwright install --with-deps chromium
      - run: pnpm db:migrate
        env:
          MIGRATION_DATABASE_URL: postgres://sixteenbit:sixteenbit@127.0.0.1:5432/sixteenbit
      - run: pnpm seed > /dev/null
        env:
          MIGRATION_DATABASE_URL: postgres://sixteenbit:sixteenbit@127.0.0.1:5432/sixteenbit
      - run: pnpm seed:large
        env:
          MIGRATION_DATABASE_URL: postgres://sixteenbit:sixteenbit@127.0.0.1:5432/sixteenbit
      - run: pnpm seed:large --project
        env:
          MIGRATION_DATABASE_URL: postgres://sixteenbit:sixteenbit@127.0.0.1:5432/sixteenbit
      - run: nproc && (vmstat -t 1 > /tmp/vmstat.txt &) && (top -b -d 1 -w 200 | grep -A 12 '^top' > /tmp/top.txt &)
      # As in CI: every spec, then the budgets.
      - run: pnpm e2e || true
      # Then the scroll budget alone, repeated.
      - run: pnpm e2e --project budgets --no-deps -g "scrolling 50,000" --repeat-each 25 --output test-results-repeat || true
      - if: ${{ always() }}
        run: node e2e/perf/diag-307-trace.ts e2e/test-results e2e/test-results-repeat
      - if: ${{ always() }}
        run: cp /tmp/vmstat.txt /tmp/top.txt e2e/test-results/ || true
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diag-307-${{ matrix.shard }}
          path: |
            e2e/test-results
            e2e/test-results-repeat
          retention-days: 3
