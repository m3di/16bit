name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on pull requests, never on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test, build
    # GitHub-hosted only. Never point this workflow at a self-hosted runner:
    # it runs code from pull requests, including forks.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # API integration tests run against a real Postgres. Same image as compose.yaml.
    services:
      db:
        image: postgres:18.7-alpine3.24
        env:
          POSTGRES_USER: sixteenbit
          POSTGRES_PASSWORD: sixteenbit
          POSTGRES_DB: sixteenbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sixteenbit -d sixteenbit"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://sixteenbit:sixteenbit@127.0.0.1:5432/sixteenbit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from `packageManager` in package.json. Not corepack:
      # pnpm 12 no longer ships the bin/pnpm.cjs that corepack launches.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end
    # GitHub-hosted only, for the same reason as the job above.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      db:
        image: postgres:18.7-alpine3.24
        env:
          POSTGRES_USER: sixteenbit
          POSTGRES_PASSWORD: sixteenbit
          POSTGRES_DB: sixteenbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sixteenbit -d sixteenbit"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://sixteenbit:sixteenbit@127.0.0.1:5432/sixteenbit
      # The development key from .env.example. Not a secret: it only opens this throwaway job's API.
      DEV_API_KEY: dev-only-key
      DEV_PRINCIPAL_ID: dev-owner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The browser version comes from the @playwright/test version pinned in e2e/package.json.
      - run: pnpm --filter @16bit/e2e exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm seed
      # Playwright starts the API and the web app itself (webServer in e2e/playwright.config.ts).
      - run: pnpm e2e

      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
