name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on pull requests, never on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test, build
    # GitHub-hosted only. Never point this workflow at a self-hosted runner:
    # it runs code from pull requests, including forks.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # API integration tests run against a real Postgres. Same image as compose.yaml.
    services:
      db:
        image: postgres:18.7-alpine3.24
        env:
          POSTGRES_USER: sixteenbit
          POSTGRES_PASSWORD: sixteenbit
          POSTGRES_DB: sixteenbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sixteenbit -d sixteenbit"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://sixteenbit:sixteenbit@127.0.0.1:5432/sixteenbit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from `packageManager` in package.json. Not corepack:
      # pnpm 12 no longer ships the bin/pnpm.cjs that corepack launches.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end
    # GitHub-hosted only, for the same reason as the job above.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      db:
        image: postgres:18.7-alpine3.24
        env:
          POSTGRES_USER: sixteenbit
          POSTGRES_PASSWORD: sixteenbit
          POSTGRES_DB: sixteenbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sixteenbit -d sixteenbit"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://sixteenbit:sixteenbit@127.0.0.1:5432/sixteenbit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The browser version comes from the @playwright/test version pinned in e2e/package.json.
      - run: pnpm --filter @16bit/e2e exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      # The output holds the seeded agent key's secret; keep it out of the public log.
      - run: pnpm seed > /dev/null
      # Playwright starts the API and the web app itself (webServer in e2e/playwright.config.ts).
      - run: pnpm e2e

      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  image:
    name: Container image
    # GitHub-hosted only, for the same reason as above. Builds and smoke-tests; never pushes.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Loaded into the local Docker engine under the tag compose.yaml uses, not pushed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: 16bit:local
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      # The same stack as `docker compose up`: Postgres, migrations, then the app.
      - name: Start the stack
        run: docker compose up --detach --no-build --wait --wait-timeout 120

      - name: Smoke test
        run: |
          set -eu
          base=http://127.0.0.1:8080
          curl --fail --silent --show-error "$base/health"
          curl --fail --silent --show-error -H 'Accept: text/html' "$base/" | grep -q '<div id="app">'
          curl --fail --silent --show-error -H 'Accept: text/html' "$base/hubs/any" | grep -q '<div id="app">'
          # No anonymous access (D41 retired in #51): the API wants a session or an agent key.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/v1/workspaces")" = 401
          # A seeded person signs in and gets data. The seed's output holds the agent secret,
          # so it stays out of the log. The cookie is Secure and this is plain HTTP, so it is
          # sent back as an explicit header rather than through a cookie jar.
          docker compose run --rm app node src/seed.ts --force > /dev/null
          sid=$(curl --fail --silent --show-error --output /dev/null --dump-header - \
            -H 'Content-Type: application/json' \
            --data '{"email":"owner@example.com","password":"16bit-dev-password"}' \
            "$base/v1/auth/login" | sed -n 's/^[Ss]et-[Cc]ookie: sid=\([^;]*\).*/\1/p')
          test -n "$sid"
          curl --fail --silent --show-error -H "Cookie: sid=$sid" "$base/v1/workspaces" | grep -q 'Pixel Works'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
