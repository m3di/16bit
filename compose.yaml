# Local services.
#   docker compose up -d db   Postgres only, for `pnpm dev`.
#   docker compose up         The whole stack from the image: Postgres, migrations, and the
#                             app (API and dashboard) on http://localhost:8080.
# Rebuild the image after pulling changes with `docker compose up --build`.
name: 16bit

services:
  db:
    image: postgres:18.7-alpine3.24
    environment:
      # Local-only credentials, matching MIGRATION_DATABASE_URL in .env.example.
      POSTGRES_USER: sixteenbit
      POSTGRES_PASSWORD: sixteenbit
      POSTGRES_DB: sixteenbit
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sixteenbit -d sixteenbit']
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot: applies pending migrations, then exits. The app starts only if it succeeds,
  # the same order as the migration job before a rollout (docs/ARCHITECTURE.md).
  migrate:
    # Built by the app service below; one build, one tag.
    image: 16bit:local
    pull_policy: never
    command: ['node', 'src/migrate.ts']
    environment:
      # Migrations run as the owner, then create the API's login role from DATABASE_URL (#44).
      MIGRATION_DATABASE_URL: postgres://sixteenbit:sixteenbit@db:5432/sixteenbit
      DATABASE_URL: postgres://sixteenbit_api:sixteenbit_api@db:5432/sixteenbit
    depends_on:
      db:
        condition: service_healthy

  app:
    image: 16bit:local
    build: .
    environment:
      # The API's role, under row-level security (#44).
      DATABASE_URL: postgres://sixteenbit_api:sixteenbit_api@db:5432/sixteenbit
      # The owner, for `docker compose run --rm app node src/seed.ts --force`, and for the
      # dev key's workspace list until DEV_API_KEY goes (#51).
      MIGRATION_DATABASE_URL: postgres://sixteenbit:sixteenbit@db:5432/sixteenbit
      DEV_API_KEY: ${DEV_API_KEY:-dev-only-key}
      DEV_PRINCIPAL_ID: ${DEV_PRINCIPAL_ID:-dev-owner}
      # Local only (D41): the browser has no key in M0, so requests without one act as the
      # dev owner, as through the Vite dev proxy. Never set this outside a local machine.
      DEV_ANONYMOUS_AS_OWNER: 'true'
      # The container binds 0.0.0.0, which the API refuses with the flag above unless told the
      # port is reachable from loopback only. That holds because of the 127.0.0.1 binding below:
      # keep the two together.
      DEV_ANONYMOUS_ALLOW_NONLOCAL: '1'
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
