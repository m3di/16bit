# Local development services. Start Postgres with `docker compose up -d db`.
# The full stack (app image plus database) arrives with #13.
name: 16bit

services:
  db:
    image: postgres:18.7-alpine3.24
    environment:
      # Local-only credentials, matching DATABASE_URL in .env.example.
      POSTGRES_USER: sixteenbit
      POSTGRES_PASSWORD: sixteenbit
      POSTGRES_DB: sixteenbit
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sixteenbit -d sixteenbit']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
